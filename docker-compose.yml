services:
  wichtelapp:
    build: .
    restart: unless-stopped
    environment:
      SERVICE_FQDN_WICHTELAPP_8000: wichtelapp.janraasch.com
      DEBUG: "FALSE"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: wichtelapp.janraasch.com,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://wichtelapp.janraasch.com
    volumes:
      - wichtel-db:/app/db
    expose:
      - "8000"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  coolify:
    external: true

volumes:
  wichtel-db:
